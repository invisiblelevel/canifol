name: Build Linux

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app (Linux)
        run: npm run tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGIKEY_CLIENT_ID: ${{ secrets.DIGIKEY_CLIENT_ID }}
          DIGIKEY_CLIENT_SECRET: ${{ secrets.DIGIKEY_CLIENT_SECRET }}
          ELEMENT14_API_KEY: ${{ secrets.ELEMENT14_API_KEY }}
          TME_TOKEN: ${{ secrets.TME_TOKEN }}
          TME_SECRET: ${{ secrets.TME_SECRET }}

      - name: Create Draft Release and Upload Linux Artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Canifol ${{ github.ref_name }}'
          releaseBody: |
            **Canifol 1.6.1 - bug-fix release**

            - **Knowledge Base downloads fixed** - no more 2 KB "corrupt PDF" files: HTTP and payload validation, corrupt-cache repair, Google Drive confirmation handling and clearer errors.
            - **BoardView parsers** - GenCAD units and pad positions, plain-text FZ, outline sanity checks for Apple BRD/BRD2, faster TVW and hardened XZZ.
            - **Datasheets** - offline favorites fixed, PDF save to any folder, raw binary transfer, LCSC errors and parallel datasheet lookup.
            - **UI/UX** - list crash and HTML-injection fixes, theme/locale sync, EN/ZH pinout fallback, unit fixes, Sketch fixes.
            - **Stability** - 33 Rust unit tests; a parser panic no longer aborts the app.

            **Downloads:**
            - Windows: `.exe` (NSIS installer) - *attach manually*
            - Android: `.apk` (Universal) - *attach manually*
            - Linux: `.deb`, `.rpm`, `.AppImage` - *auto-built*
          releaseDraft: true
          prerelease: false
