name: Build Linux

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app (Linux)
        run: npm run tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGIKEY_CLIENT_ID: ${{ secrets.DIGIKEY_CLIENT_ID }}
          DIGIKEY_CLIENT_SECRET: ${{ secrets.DIGIKEY_CLIENT_SECRET }}
          ELEMENT14_API_KEY: ${{ secrets.ELEMENT14_API_KEY }}
          TME_TOKEN: ${{ secrets.TME_TOKEN }}
          TME_SECRET: ${{ secrets.TME_SECRET }}

      - name: Create Draft Release and Upload Linux Artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Canifol ${{ github.ref_name }}'
          releaseBody: |
            **Canifol 1.6.2 - bug-fix and content release**

            - **Portable builds fixed** - datasheet API credentials are embedded at compile time from `src-tauri/.env` or CI secrets, so the portable exe and APK can search DigiKey, LCSC, Farnell and TME.
            - **30 new pinouts** - 10 BIOS/firmware SPI flash chips (W25Q32JV, W25Q64JV, W25Q128JV, W25Q256JV, MX25L6406E, MX25L12835F, GD25Q64C, GD25Q128C, SST25VF016B, EN25Q128), 10 import ICs and 10 Soviet ICs.
            - **Localized** in Russian, English and Chinese, with package drawings.
            - **Build scripts** no longer contain hardcoded API keys.

            **Downloads:**
            - Windows: `.exe` (NSIS installer) - *attach manually*
            - Android: `.apk` (Universal) - *attach manually*
            - Linux: `.deb`, `.rpm`, `.AppImage` - *auto-built*
          releaseDraft: true
          prerelease: false
