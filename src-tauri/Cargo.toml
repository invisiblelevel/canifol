[package]
name = "canifol"
version = "1.2.0"
description = "Canifol — Repairman's toolkit"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "canifol_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
tauri-plugin-fs = "2"
dirs = "5"
sys-locale = "0.3"
dotenvy = "0.15"
tauri-plugin-android-fs = "27"

# BoardView
pcbrepair = "0.4"
gencad = "0.2"
num-traits = "0.2.19"
flate2 = "1"

# HTTP-запросы к DigiKey
tauri-plugin-http = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-dialog = "2.8.3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
