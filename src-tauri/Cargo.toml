[package]
name = "canifol"
version = "1.5.3"
description = "Canifol — Repairman's toolkit"
authors = ["you"]
edition = "2021"

[lib]
name = "canifol_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
megalib = "0.11.0"
tokio = { version = "1", features = ["time", "fs"] }
serde_json = "1"
urlencoding = "2"
tauri-plugin-fs = "2"
dirs = "5"
sys-locale = "0.3"
dotenvy = "0.15"
tauri-plugin-android-fs = "27"
regex = "1"
scraper = "0.20"
des = "0.8"
encoding_rs = "0.8"
md5 = "0.7"
hmac = "0.12"
sha2 = "0.10"


# BoardView
pcbrepair = "0.4"
gencad = "0.2"
num-traits = "0.2.19"
flate2 = "1"

# HTTP-запросы к DigiKey
tauri-plugin-http = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-dialog = "2.8.3"
quick-xml = "0.31"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
